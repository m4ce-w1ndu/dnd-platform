name: tavolo-rs

on:
  push:
    branches: [main]
    paths: ["tavolo-rs/**", "tavolo/**", "tavolo-web/**", ".github/workflows/tavolo-rs.yml"]
  pull_request:
    paths: ["tavolo-rs/**", "tavolo/**", "tavolo-web/**", ".github/workflows/tavolo-rs.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: tavolo-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tavolo-rs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Formattazione
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test unitari e fuzzing leggero
        run: cargo test --release --locked
      - name: I tipi TypeScript generati dal server sono aggiornati
        run: git diff --exit-code -- ../tavolo-web/src/app/api/generati
      - name: Test end-to-end contro il server Python (il riferimento)
        run: ./e2e/run.sh python
      - name: Test end-to-end contro il server Rust
        run: ./e2e/run.sh target/release/tavolo
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Vulnerabilità note nelle dipendenze
        run: cargo audit

  client:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tavolo-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tavolo-web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Test unitari (Vitest)
        run: npx ng test --watch=false
      - name: Build di produzione (strict, budget)
        run: npx ng build

  immagine:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Costruisce l'immagine (binario statico, FROM scratch)
        run: docker build -f tavolo-rs/Containerfile -t tavolo-virtuale-rs .
      - name: L'immagine parte e risponde
        run: |
          mkdir -p dati avventure && sudo chown 1000:1000 dati avventure
          docker run -d --name tavolo -p 8095:8000 --read-only --tmpfs /tmp \
            -v "$PWD/dati:/app/dati" -v "$PWD/avventure:/app/avventure" -e MASTER_PASSWORD=ci-password-123 tavolo-virtuale-rs
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8095/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8095/api/info
          curl -fsS http://127.0.0.1:8095/ | grep -q "<app-root>"            # client nuovo
          curl -fsS http://127.0.0.1:8095/vecchio/ | grep -q 'id="app"'      # client vecchio
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8095/beta/)" = 308
          docker exec tavolo /app/tavolo --healthcheck
          docker exec tavolo /app/tavolo verifica-db /app/dati/tavolo.db
          docker images tavolo-virtuale-rs
      - name: Registro del container
        if: always()
        run: docker logs tavolo || true
